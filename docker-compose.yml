version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./jobs.db:/app/jobs.db
    env_file:
      - .env
    environment:
      - FFMPEG_BIN=ffmpeg
      - FFPROBE_BIN=ffprobe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
